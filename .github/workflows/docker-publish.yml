
name: BusTrip Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend-BusTrip/bustrip-frontend
          file: ./Frontend-BusTrip/bustrip-frontend/Dockerfile
          push: true
          tags: sravanthi2580/bustrip-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./CrudServiceProject
          file: ./CrudServiceProject/Dockerfile
          push: true
          tags: sravanthi2580/bustrip-backend:latest

      - name: Build and push Eureka server
        uses: docker/build-push-action@v6
        with:
          context: ./EurekaServer
          file: ./EurekaServer/Dockerfile
          push: true
          tags: sravanthi2580/bustrip-eureka-server:latest
